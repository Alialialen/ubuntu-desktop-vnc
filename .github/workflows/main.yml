name: Start Ubuntu Desktop + noVNC

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DISPLAY: ":1"
      VNC_PORT: 5901
      NOVNC_PORT: 6080

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Install Desktop Environment & VNC
        run: |
          set -euo pipefail

          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies tightvncserver git wget python3-pip

          # أنشئ مجلد vnc وتأكّد الأذونات
          mkdir -p ~/.vnc
          chmod 700 ~/.vnc

          # استخدم كلمة المرور من Secrets - لا تعرضها في اللوج
          if [ -z "${{ secrets.VNC_PASSWORD }}" ]; then
            echo "ERROR: VNC_PASSWORD secret not set"
            exit 1
          fi

          # اكتب كلمة المرور إلى ملف passwd الخاص بـ VNC (vncpasswd -f يقرأ من stdin ويعطي الباينري)
          echo "${{ secrets.VNC_PASSWORD }}" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # أنشئ ملف xstartup الصحيح (startxfce4)
          cat > ~/.vnc/xstartup <<'XSTART'
#!/bin/bash
xrdb $HOME/.Xresources
# تعطيل شاشة الترحيب لو لزم
# export XKL_XMODMAP_DISABLE=1
startxfce4 &
XSTART

          chmod +x ~/.vnc/xstartup

          # شغّل vncserver بالمعايرة المطلوبة
          # نقتل أي instance قديمة أولًا ثم نشغّل واحدة جديدة
          vncserver -kill :1 || true
          vncserver :1 -geometry 1280x720 -depth 24

      - name: Setup noVNC & websockify
        run: |
          set -euo pipefail

          # clone noVNC and websockify if not present
          if [ ! -d "$HOME/noVNC" ]; then
            git clone https://github.com/novnc/noVNC.git "$HOME/noVNC"
          fi
          if [ ! -d "$HOME/noVNC/utils/websockify" ]; then
            git clone https://github.com/novnc/websockify.git "$HOME/noVNC/utils/websockify"
          fi

          # تأكد من أن launch.sh قابل للتنفيذ
          chmod +x "$HOME/noVNC/utils/launch.sh" || true

          # شغّل noVNC على الخلفية (سيستمع على NOVNC_PORT و يتصل بـ VNC_PORT)
          # nohup/setsid لتجنّب قتل العملية عند انتهاء الـ job (لكن GitHub runner سينهيها بعد انتهاء الـ job)
          nohup "$HOME/noVNC/utils/launch.sh" --vnc localhost:${VNC_PORT} --listen ${NOVNC_PORT} >/tmp/novnc.out 2>&1 &

          # قليل انتظار للتأكد أن noVNC بدأ
          sleep 5
          echo "noVNC started, check /tmp/novnc.out for output"

      - name: (Optional) Create reverse tunnel via serveo (insecure / legacy)
        run: |
          # ملاحظة: serveo قد لا يكون دائمًا متاحًا؛ استخدم ngrok أو إعداد SSH مع مفاتيح بدلاً منه.
          # السطر التالي سيحاول عمل reverse tunnel (قد يطلب كلمة مرور أو فشل)
          nohup ssh -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes -R 80:localhost:${NOVNC_PORT} serveo.net >/tmp/serveo.out 2>&1 &
          sleep 5 || true
          echo "serveo (attempt) logged to /tmp/serveo.out"

      - name: Show info / tail logs
        run: |
          echo "VNC display: ${DISPLAY}  (VNC port ${VNC_PORT})"
          echo "noVNC web port: ${NOVNC_PORT}"
          echo "If you used serveo, check /tmp/serveo.out for the public URL (or use ngrok / other tunnel)."
          echo "---- noVNC log ----"
          tail -n +1 /tmp/novnc.out || true
          echo "---- serveo log ----"
          tail -n +1 /tmp/serveo.out || true
